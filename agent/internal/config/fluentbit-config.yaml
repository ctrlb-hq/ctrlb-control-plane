service:
  flush: 1
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  hot_reload: on

pipeline:
  inputs:
    - name: node_exporter_metrics
      tag: ctrlb_agent_node_metrics
      scrape_interval: 2
    - name: fluentbit_metrics
      tag: ctrlb_agent_internal_metrics
      scrape_interval: 2
  outputs:
    - name: prometheus_exporter
      match: ctrlb_agent_*_metrics
      host: 0.0.0.0
      port: 2021