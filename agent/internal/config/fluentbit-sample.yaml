# Sample Fluent Bit Configuration for CtrlB Agent
# This configuration demonstrates a basic setup for Fluent Bit with HTTP monitoring enabled

service:
  # Flush interval in seconds
  flush: 1
  
  # Enable daemon mode (recommended for production)
  daemon: off
  
  # Log level: error, warning, info, debug, trace
  log_level: info
  
  # HTTP Server for monitoring and hot reload
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  
  # Enable hot reload functionality
  hot_reload: on
  
  # Storage settings for buffering
  storage.path: /var/log/fluent-bit-storage/
  storage.sync: normal
  storage.checksum: off
  storage.max_chunks_up: 128
  storage.backlog.mem_limit: 5M
  
  # Health check settings
  health_check: on
  hc_errors_count: 5
  hc_retry_failure_count: 5
  hc_period: 60

# Pipeline configuration
pipeline:
  # Input plugins - data sources
  inputs:
    # Example: CPU metrics
    - name: cpu
      alias: system_cpu
      tag: metrics.cpu
      # Collect CPU metrics every 5 seconds
      interval_sec: 5
    
    # Example: Memory metrics
    - name: mem
      alias: system_memory
      tag: metrics.memory
      interval_sec: 5
    
    # Example: Log files
    - name: tail
      alias: application_logs
      tag: logs.app
      path: /var/log/app/*.log
      read_from_head: false
      refresh_interval: 10
      # Storage configuration for this input
      storage.type: filesystem
      
    # Example: TCP input for receiving data
    - name: tcp
      alias: tcp_input
      tag: logs.tcp
      listen: 0.0.0.0
      port: 5170
      format: json
  
  # Filter plugins - data transformation and enrichment
  filters:
    # Add hostname to all records
    - name: modify
      match: '*'
      add: hostname ${HOSTNAME}
      add: agent_type fluent-bit
    
    # Example: Grep filter to include/exclude records
    - name: grep
      match: 'logs.*'
      # Exclude records with specific patterns
      exclude: log ERROR|CRITICAL
    
    # Example: Parser for structured logs
    - name: parser
      match: 'logs.*'
      key_name: log
      parser: json
      reserve_data: true
  
  # Output plugins - data destinations
  outputs:
    # Example: Forward to another Fluent Bit or Fluentd instance
    - name: forward
      alias: forward_output
      match: '*'
      host: 127.0.0.1
      port: 24224
      # Retry configuration
      retry_limit: 3
      
    # Example: HTTP output (e.g., to send to an API)
    - name: http
      alias: http_output
      match: 'metrics.*'
      host: api.example.com
      port: 443
      uri: /v1/metrics
      format: json
      tls: on
      tls.verify: on
      # Buffer configuration
      storage.total_limit_size: 5M
      
    # Example: Standard output for debugging
    - name: stdout
      alias: debug_output
      match: 'logs.app'
      format: json_lines
    
    # Example: File output
    - name: file
      alias: file_output
      match: 'metrics.*'
      path: /var/log/fluent-bit-output
      file: metrics.log
      format: json

# Parser definitions (optional)
parsers:
  - name: json
    format: json
    time_key: time
    time_format: "%Y-%m-%dT%H:%M:%S.%L%z"
  
  - name: syslog
    format: regex
    regex: '^<(?<pri>[0-9]+)>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$'
    time_key: time
    time_format: "%b %d %H:%M:%S"

