name: Publish container images

on:
  push:
    tags: ['containers/*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }} (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - image: ctrlb-control-plane-backend
            context: backend
            cache_scope: ctrlb-control-plane-backend-linux-amd64
            license: AGPL-3.0-only
          - image: ctrlb-otel-collector
            context: agent
            # Keep the warmed compilation layers when renaming the registry package.
            cache_scope: ctrlb-agent-linux-amd64
            license: AGPL-3.0-or-later
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select short commit image tag
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sha="$(git rev-parse HEAD)"
          tag="$(git rev-parse --short=7 HEAD)"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          {
            printf 'name=%s\n' "$image"
            printf 'tag=%s\n' "$tag"
            printf 'sha=%s\n' "$sha"
            printf 'created=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Free space for collector dependencies
        if: matrix.image == 'ctrlb-otel-collector'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up a bounded BuildKit builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: |
            memory=6g
            memory-swap=8g
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
            org.opencontainers.image.licenses=${{ matrix.license }}
          build-args: |
            GO_BUILD_PARALLELISM=1
            GO_MEMORY_LIMIT=2GiB
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max,ignore-error=true

      - name: Record immutable pull reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            printf '### %s\n\n' "$IMAGE_NAME"
            printf 'Tag: `%s:%s`\n\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf 'Pinned image: `%s@%s`\n\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
            printf 'Platform: `linux/amd64`\n\n'
            printf 'New GHCR packages default to private. A package admin must make this package public in its settings before anonymous pulls work.\n'
          } >> "$GITHUB_STEP_SUMMARY"
