name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Native runners keep the SQLite backend's CGO build valid on both CPUs.
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            backend/go.sum
      - name: Build collector in its module
        working-directory: agent
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o ../ctrlb-agent-linux-${{ matrix.goarch }} ./cmd/ctrlb_collector
      - name: Build backend in its module with SQLite
        working-directory: backend
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-s -w" -o ../ctrlb-control-plane-backend-linux-${{ matrix.goarch }} ./cmd/backend
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ctrlb-agent-linux-${{ matrix.goarch }}
            ctrlb-control-plane-backend-linux-${{ matrix.goarch }}
