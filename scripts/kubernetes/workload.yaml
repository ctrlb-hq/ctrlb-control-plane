apiVersion: v1
kind: Namespace
metadata:
  name: ctrlb-demo
  labels:
    app.kubernetes.io/part-of: ctrlb-kubernetes-v1-demo
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-generator
  namespace: ctrlb-demo
spec:
  selector:
    matchLabels:
      app: ctrlb-demo-log-generator
  template:
    metadata:
      labels:
        app: ctrlb-demo-log-generator
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: logger
          image: busybox:1.37
          command: [sh, -c]
          args:
            - 'while true; do echo "ctrlb-demo-marker node=$NODE_NAME pod=$POD_NAME time=$(date -u +%s)"; sleep 2; done'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
